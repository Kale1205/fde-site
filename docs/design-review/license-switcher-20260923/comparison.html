<!doctype html>
<meta charset="utf-8">
<title>License switcher QA comparison</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 20px; background: #d8d8d4; color: #10251d; font: 13px system-ui, sans-serif; }
  main { display: grid; grid-template-columns: 390px 390px; gap: 16px; align-items: start; }
  figure { margin: 0; }
  figcaption { height: 34px; font-weight: 700; letter-spacing: .04em; }
  img, iframe { display: block; width: 390px; height: 844px; border: 0; background: #faf8f4; object-fit: cover; object-position: top; }
</style>
<main>
  <figure><figcaption>BEFORE — reported sticky switcher</figcaption><img src="source-reported.jpg" alt="Reported sticky plan switcher"></figure>
  <figure><figcaption>AFTER — normal document flow</figcaption><iframe id="final" src="../../../license.html" title="Corrected license page"></iframe></figure>
</main>
<script>
  document.getElementById('final').addEventListener('load', (event) => {
    event.currentTarget.contentWindow.scrollTo(0, 824);
  });
</script>
