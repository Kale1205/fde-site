name: Apply site-wide copy polish

on:
  push:
    paths:
      - '.github/workflows/apply-copy-polish.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch pages and copy hooks
        run: |
          python - <<'PY'
          from pathlib import Path

          pages = ['index.html','why.html','goals.html','demo.html','contact.html']
          for name in pages:
              p=Path(name)
              s=p.read_text(encoding='utf-8')
              s=s.replace('20260816-1650','20260816-1718')
              if 'polish.css?v=20260816-1718' not in s:
                  s=s.replace('<link rel="stylesheet" href="refinements.css?v=20260816-1718">', '<link rel="stylesheet" href="refinements.css?v=20260816-1718"><link rel="stylesheet" href="polish.css?v=20260816-1718">')
              if 'i18n-polish.js?v=20260816-1718' not in s:
                  s=s.replace('<script defer src="i18n-overrides.js?v=20260816-1718"></script>', '<script defer src="i18n-overrides.js?v=20260816-1718"></script><script defer src="i18n-polish.js?v=20260816-1718"></script>')
              if name=='index.html':
                  s=s.replace('<span data-i18n="strengthJapan">日本製</span>', '<span data-origin-note data-i18n="strengthJapan"></span>')
              if name=='goals.html':
                  s=s.replace('<div class="made-japan" data-i18n="madeJapan">日本製ソフトウェア</div>', '<div class="made-japan" data-origin-note data-i18n="madeJapan"></div>')
              p.write_text(s,encoding='utf-8')

          p=Path('site.js')
          s=p.read_text(encoding='utf-8')
          old="if(md&&d.metaDescription)md.content=d.metaDescription;polishJapaneseHeadings()}"
          new="if(md&&d.metaDescription)md.content=d.metaDescription;qsa('.display br').forEach(br=>br.replaceWith(document.createTextNode(' ')));polishJapaneseHeadings()}"
          if old in s:
              s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')

          p=Path('i18n-polish.js')
          s=p.read_text(encoding='utf-8')
          if "whyHero:'技術を導入するだけでなく、現場で使えるところまで届ける'" not in s:
              s=s.replace("productsHero:'業務ソフトを、必要なところから',", "productsHero:'業務ソフトを、必要なところから',whyHero:'技術を導入するだけでなく、現場で使えるところまで届ける',")
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html why.html goals.html demo.html contact.html site.js i18n-polish.js
          git commit -m "Polish copy, line breaks, and origin messaging"
          git push
