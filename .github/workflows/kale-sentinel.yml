name: Kale Sentinel operational check

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: kale-sentinel-operational-check
  cancel-in-progress: false

jobs:
  observe:
    name: read-only-operational-observation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_SENTINEL_TOKEN: ${{ secrets.CLOUDFLARE_SENTINEL_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify dedicated read-only observation credential
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_SENTINEL_TOKEN:-}" ]; then
            echo "CLOUDFLARE_SENTINEL_TOKEN is not configured."
            exit 1
          fi
          echo "Dedicated Sentinel credential is configured."

      - name: Run Kale Sentinel read-only probe
        run: python scripts/kale_sentinel_live.py --output sentinel-report

      - name: Upload operational evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kale-sentinel-operational-report
          path: sentinel-report/
          if-no-files-found: ignore
          retention-days: 14
