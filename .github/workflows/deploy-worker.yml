name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - main
    paths:
      - 'worker/**'
      - '!worker/src/staging-*.js'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-worker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy-worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Production configuration safety check
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import sys

          path = Path('worker/wrangler.toml')
          text = path.read_text(encoding='utf-8')

          main = re.search(r'^main\s*=\s*["\']([^"\']+)["\']', text, re.MULTILINE)
          if not main or not re.fullmatch(r'src/index-v\d+\.js', main.group(1)):
              sys.exit('Refusing production deploy: invalid versioned Worker entry point.')

          account_id = re.search(r'^account_id\s*=\s*["\']([0-9a-fA-F]{32})["\']', text, re.MULTILINE)
          if not account_id:
              sys.exit('Refusing production deploy: Cloudflare account_id is not pinned.')

          if not re.search(r'^keep_vars\s*=\s*true\s*$', text, re.MULTILINE):
              sys.exit('Refusing production deploy: keep_vars = true is required.')

          if not re.search(r'^PRODUCTION_COMMERCE_ENABLED\s*=\s*["\']false["\']\s*$', text, re.MULTILINE):
              sys.exit('Refusing production deploy: legacy production commerce must remain explicitly disabled.')

          blocks = re.findall(r'\[\[kv_namespaces\]\](.*?)(?=\n\[|\Z)', text, re.DOTALL)
          order_status = next((b for b in blocks if re.search(r'^\s*binding\s*=\s*["\']ORDER_STATUS["\']', b, re.MULTILINE)), None)
          if order_status is None:
              sys.exit('Refusing production deploy: ORDER_STATUS KV binding is missing.')

          namespace_id = re.search(r'^\s*id\s*=\s*["\']([0-9a-fA-F]{32})["\']', order_status, re.MULTILINE)
          if not namespace_id:
              sys.exit('Refusing production deploy: ORDER_STATUS must reference the existing 32-character KV namespace ID.')

          print('Production Worker configuration safety check passed.')
          PY

      - name: Verify production commerce remains disabled
        run: node scripts/test_production_commerce_gate.mjs

      - name: Verify contact email routing
        run: node scripts/test_contact_email_routing.mjs

      - name: Verify Cloudflare deployment credential exists
        shell: bash
        env:
          TOKEN_PRESENT: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          if [ "$TOKEN_PRESENT" != "true" ]; then
            echo "CLOUDFLARE_API_TOKEN is not configured in GitHub Actions Secrets."
            exit 1
          fi

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: worker
          wranglerVersion: '4'
          command: deploy --experimental-provision=false --experimental-auto-create=false
