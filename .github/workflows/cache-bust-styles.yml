name: Sync site build version

on:
  workflow_dispatch:
  push:
    branches-ignore:
      - main
    paths:
      - '*.html'
      - '*.js'
      - '*.css'
      - 'scripts/sync_build_version.py'
      - '.github/workflows/cache-bust-styles.yml'

permissions:
  contents: write

jobs:
  sync-build-version:
    if: github.actor != 'github-actions[bot]' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4

      - name: Generate one build ID for the whole frontend
        run: |
          TZ=Asia/Tokyo date +'%Y%m%d-%H%M%S' > build-version.txt
          echo "Build ID (JST): $(cat build-version.txt)"

      - name: Sync JS and CSS cache keys
        run: python scripts/sync_build_version.py

      - name: Commit synchronized asset versions to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build-version.txt '*.html' contact-config.js i18n-final.js
          if git diff --cached --quiet; then
            echo "All pages already use the current build version."
            exit 0
          fi
          VERSION="$(cat build-version.txt)"
          git commit -m "Sync site asset build ${VERSION}"
          git push
