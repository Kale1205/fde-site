name: Force refresh site styles

on:
  push:
    paths:
      - '.github/workflows/cache-bust-styles.yml'

permissions:
  contents: write

jobs:
  cache-bust:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add stylesheet version query
        run: |
          python - <<'PY'
          from pathlib import Path
          version = '20260816-1546'
          for p in Path('.').glob('*.html'):
              s = p.read_text(encoding='utf-8')
              s = s.replace('href="styles.css"', f'href="styles.css?v={version}"')
              p.write_text(s, encoding='utf-8')
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add *.html
          if git diff --cached --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git commit -m "Bust stylesheet cache"
          git push
