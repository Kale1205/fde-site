name: Apply fixed localization

on:
  push:
    paths:
      - '.github/workflows/apply-fixed-localization.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply fixed localization
        run: python scripts/enable_fixed_localization.py
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Use fixed translations for all supported languages"
          git push
