name: Apply language selector update

on:
  push:
    paths:
      - '.github/workflows/apply-language-selector.yml'
      - 'scripts/refine_language_selector.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Update index
        run: python scripts/refine_language_selector.py
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Refine Asia language selector"
          git push
