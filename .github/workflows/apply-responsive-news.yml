name: Apply responsive and News redesign

on:
  push:
    paths:
      - '.github/workflows/apply-responsive-news.yml'
      - '.github/scripts/apply_responsive_news.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/scripts/apply_responsive_news.py
      - name: Commit changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html why.html goals.html contact.html news.html demo.html
          git commit -m "Improve responsive layouts and redesign News"
          git push
