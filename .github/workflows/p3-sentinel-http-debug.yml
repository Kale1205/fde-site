name: P3 Sentinel HTTP debug

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  debug:
    if: github.event.pull_request.number == 48
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Probe staging HTTP endpoints
        run: python scripts/p3_sentinel_http_debug.py
