name: One-time shared product card patch

on:
  push:
    branches:
      - fix/instagram-and-product-cards
    paths:
      - '.github/workflows/apply-shared-product-cards-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply shared product card stylesheet
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          version=Path('build-version.txt').read_text(encoding='utf-8').strip()
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker=f'<link rel="stylesheet" href="entry-motion.css?v={version}">'
          addition=marker+f'<link rel="stylesheet" href="product-plans.css?v={version}">'
          if 'product-plans.css' not in s:
              if marker not in s: raise SystemExit('English stylesheet insertion marker not found')
              s=s.replace(marker,addition,1)
          p.write_text(s,encoding='utf-8')

          p=Path('ja/index.html')
          s=p.read_text(encoding='utf-8')
          marker=f'<link rel="stylesheet" href="../entry-motion.css?v={version}">'
          addition=marker+f'<link rel="stylesheet" href="../product-plans.css?v={version}">'
          if 'product-plans.css' not in s:
              if marker not in s: raise SystemExit('Japanese stylesheet insertion marker not found')
              s=s.replace(marker,addition,1)
          s=re.sub(r'<style>\.ja-brand\{.*?</style>', '<style>.ja-brand{display:flex;align-items:center;gap:10px}.ja-brand img{width:32px;height:32px;display:block}.ja-brand-copy{display:flex;flex-direction:column}.ja-brand-copy span{font-weight:900}.ja-brand-copy small{font-size:10px;letter-spacing:.04em}</style>', s, count=1, flags=re.S)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html ja/index.html
          git commit -m "Use shared product plan card styles"
          git push
