name: Kale Outreach sales governance check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sales-execution-governance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate sales execution extension
        run: python scripts/validate_p5_outreach_sales.py

      - name: Run deterministic sales execution tests
        run: python scripts/test_p5_outreach_sales_rules.py

      - name: Validate Sales Operations architecture
        run: python scripts/validate_sales_operations.py

      - name: Run deterministic Sales Operations tests
        run: python scripts/test_sales_operations_rules.py

      - name: Verify pending local Sales Workspace boundaries
        run: python scripts/test_local_sales_workspace.py
