name: CMS - Instagram
run-name: "CMS Instagram: ${{ inputs.handle }}"

on:
  workflow_dispatch:
    inputs:
      profile_url:
        description: "InstagramプロフィールURL"
        required: true
        type: string
      handle:
        description: "Instagramハンドル"
        required: true
        default: "@kale1999_"
        type: string
      description_ja:
        description: "紹介文（日本語）"
        required: true
        type: string
      description_en:
        description: "Description (English)"
        required: true
        type: string
      image_url:
        description: "表示画像URLまたはリポジトリ内パス（空欄でロゴ表示）"
        required: false
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Instagram content
        env:
          PROFILE_URL: ${{ inputs.profile_url }}
          HANDLE: ${{ inputs.handle }}
          DESCRIPTION_JA: ${{ inputs.description_ja }}
          DESCRIPTION_EN: ${{ inputs.description_en }}
          IMAGE_URL: ${{ inputs.image_url }}
        run: python .github/scripts/cms_update.py instagram
      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/site-content.json
          git commit -m "CMS: update Instagram content"
          git push
