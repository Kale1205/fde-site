name: CMS - Latest Strip
run-name: "CMS Latest Strip: ${{ inputs.text_ja }}"

on:
  workflow_dispatch:
    inputs:
      enabled:
        description: "上部の最新情報帯を表示する"
        required: true
        default: true
        type: boolean
      label_ja:
        description: "ラベル（日本語）"
        required: true
        default: "最新情報"
        type: string
      label_en:
        description: "Label (English)"
        required: true
        default: "Latest"
        type: string
      text_ja:
        description: "表示文（日本語）"
        required: true
        type: string
      text_en:
        description: "Text (English)"
        required: true
        type: string
      link:
        description: "クリック時のリンク先"
        required: true
        default: "news.html"
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update latest strip
        env:
          ENABLED: ${{ inputs.enabled }}
          LABEL_JA: ${{ inputs.label_ja }}
          LABEL_EN: ${{ inputs.label_en }}
          TEXT_JA: ${{ inputs.text_ja }}
          TEXT_EN: ${{ inputs.text_en }}
          LINK: ${{ inputs.link }}
        run: python .github/scripts/cms_update.py strip
      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/site-content.json
          git commit -m "CMS: update latest strip"
          git push
