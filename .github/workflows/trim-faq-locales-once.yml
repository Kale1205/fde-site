name: One-time FAQ locale cleanup

on:
  push:
    paths:
      - '.github/workflows/trim-faq-locales-once.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep only Japanese and English FAQ data
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          path=Path('content/faq-content.json')
          data=json.loads(path.read_text(encoding='utf-8'))
          keep={'ja','en'}
          data['version']=3
          data['locales']=['ja','en']

          def prune(obj):
              if isinstance(obj,dict):
                  for key in list(obj):
                      if key not in keep:
                          del obj[key]

          for entry in (data.get('categories') or {}).values():
              prune(entry.get('label'))
          for entry in (data.get('subcategories') or {}).values():
              prune(entry.get('label'))
          for item in data.get('faq') or []:
              for field in ('question','answer','keywords','synonyms'):
                  prune(item.get(field))

          path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/faq-content.json
          git commit -m "Keep FAQ data Japanese and English only"
          git push
