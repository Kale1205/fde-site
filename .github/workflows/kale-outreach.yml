name: Kale Outreach foundation check

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kale-outreach-foundation-check
  cancel-in-progress: false

jobs:
  validate:
    name: outbound-growth-draft-only-foundation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate Kale Outreach authority boundary
        run: python scripts/validate_p3_outreach.py

      - name: Run deterministic Kale Outreach rule tests
        run: python scripts/test_p3_outreach_rules.py

      - name: Generate synthetic outreach evidence
        run: python scripts/kale_outreach_dry_run.py --output outreach-report

      - name: Upload foundation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kale-outreach-foundation-report
          path: outreach-report/
          if-no-files-found: ignore
          retention-days: 14
