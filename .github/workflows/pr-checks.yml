name: PR checks

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    env:
      SITEMAP_BASE_REF: ${{ github.event.pull_request.base.sha || 'origin/main' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Sitemap lastmod regression tests
        run: python scripts/test_sitemap_lastmod.py

      - name: Generate sitemap from substantive HTML changes
        run: npm run sitemap

      - name: Verify generated sitemap state is committed
        run: git diff --exit-code -- sitemap-lastmod.json sitemap.xml

      - name: Repository consistency checks
        run: npm run validate

      - name: Linear-inspired redesign contracts
        run: node scripts/test_linear_redesign.mjs

      - name: Approved multilingual Quiet Form pages and CMS presentation contracts
        run: node --test scripts/test_quiet_homepages.mjs scripts/test_quiet_pages.mjs scripts/test_quiet_form_preview.mjs scripts/test_quiet_license.mjs scripts/test_quiet_demo.mjs scripts/test_quiet_goals.mjs scripts/test_quiet_news.mjs scripts/test_quiet_contact.mjs scripts/test_quiet_order.mjs scripts/test_quiet_customer.mjs scripts/test_release_notice_policy.mjs scripts/test_quiet_admin.mjs

      - name: Approved W02 License composition is current
        run: node scripts/build_quiet_license.mjs --check

      - name: Selected W03 Demo composition is current
        run: node scripts/build_quiet_demo.mjs --check

      - name: Approved multilingual homepages are current
        run: node scripts/build_quiet_homepages.mjs --check

      - name: Chinese license locale is current
        run: node scripts/generate_zh_locale.mjs --check

      - name: Pre-staging integrity checks
        run: python scripts/validate_pre_staging.py

      - name: Slack notification integrity checks
        run: python scripts/validate_notifications.py

      - name: P3 Agent Governance cross-agent contract checks
        run: python scripts/validate_p3_governance.py

      - name: P3 Agent Governance deterministic rule tests
        run: python scripts/test_p3_governance.py

      - name: Current Agent Runtime Governance contract checks
        run: python scripts/validate_agent_runtime.py

      - name: Current Agent Runtime Governance deterministic negative tests
        run: python scripts/test_agent_runtime.py

      - name: P3 Kale Outreach outbound-growth/draft-only contract checks
        run: python scripts/validate_p3_outreach.py

      - name: P3 Kale Outreach deterministic rule tests
        run: python scripts/test_p3_outreach_rules.py

      - name: Kale Outreach gated sales execution contract checks
        run: python scripts/validate_p5_outreach_sales.py

      - name: Kale Outreach gated sales execution deterministic rule tests
        run: python scripts/test_p5_outreach_sales_rules.py

      - name: Sales Operations architecture contract checks
        run: python scripts/validate_sales_operations.py

      - name: Sales Operations deterministic rule tests
        run: python scripts/test_sales_operations_rules.py

      - name: Local Sales Workspace setup and data-boundary negative tests
        run: python scripts/test_local_sales_workspace.py

      - name: P3 Kale’s Office public-editorial/draft-only contract checks
        run: python scripts/validate_p3_office.py

      - name: P3 Kale’s Office deterministic rule tests
        run: python scripts/test_p3_office_rules.py

      - name: P3 Kale Desk inbound-only/no-send contract checks
        run: python scripts/validate_p3_desk.py

      - name: P3 Kale Desk deterministic rule tests
        run: python scripts/test_p3_desk_rules.py

      - name: P3 Kale Sentinel read-only contract checks
        run: python scripts/validate_p3_sentinel.py

      - name: P3 Kale Sentinel deterministic rule tests
        run: python scripts/test_p3_sentinel_rules.py

      - name: P3 Auto Security contract checks
        run: python scripts/validate_p3_security.py

      - name: Security tooling hardening contract checks
        run: python scripts/validate_security_tooling.py

      - name: P3 Auto Security critical gate
        run: python scripts/security_audit.py

      - name: P2 staging isolation checks
        run: python scripts/validate_p2_staging.py

      - name: P2 quote policy tests
        run: node scripts/test_p2_quote_policy.mjs

      - name: P2 audit log tests
        run: node scripts/test_p2_audit_log.mjs

      - name: P2 expiry Cron tests
        run: node scripts/test_p2_expiry_cron.mjs

      - name: P2 Stripe webhook tests
        run: node scripts/test_p2_stripe_webhook.mjs

      - name: P2 Stripe Checkout tests
        run: node scripts/test_p2_stripe_checkout.mjs

      - name: P2 EULA acceptance QA tests
        run: node scripts/test_p2_eula_acceptance.mjs

      - name: P2 fulfillment boundary tests
        run: node scripts/test_p2_fulfillment.mjs

      - name: Production pre-release commerce gate tests
        run: node scripts/test_production_commerce_gate.mjs

      - name: Contact email routing tests
        run: node scripts/test_contact_email_routing.mjs

      - name: Compile Python helper scripts
        run: python -m compileall -q scripts

      - name: Check browser JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find . -maxdepth 1 -type f -name '*.js' -print0)

      - name: Check Cloudflare Worker JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --input-type=module --check < "$file"
          done < <(find worker/src -type f -name '*.js' -print0)
