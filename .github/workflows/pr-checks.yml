name: PR checks

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Repository consistency checks
        run: python scripts/validate_repo.py

      - name: Pre-staging integrity checks
        run: python scripts/validate_pre_staging.py

      - name: Slack notification integrity checks
        run: python scripts/validate_notifications.py

      - name: P2 staging isolation checks
        run: python scripts/validate_p2_staging.py

      - name: P2 quote policy tests
        run: node scripts/test_p2_quote_policy.mjs

      - name: P2 audit log tests
        run: node scripts/test_p2_audit_log.mjs

      - name: P2 expiry Cron tests
        run: node scripts/test_p2_expiry_cron.mjs

      - name: P2 Stripe webhook tests
        run: node scripts/test_p2_stripe_webhook.mjs

      - name: P2 Stripe Checkout tests
        run: node scripts/test_p2_stripe_checkout.mjs

      - name: P2 EULA acceptance QA tests
        run: node scripts/test_p2_eula_acceptance.mjs

      - name: P2 fulfillment boundary tests
        run: node scripts/test_p2_fulfillment.mjs

      - name: Compile Python helper scripts
        run: python -m compileall -q scripts

      - name: Check browser JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find . -maxdepth 1 -type f -name '*.js' -print0)

      - name: Check Cloudflare Worker JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --input-type=module --check < "$file"
          done < <(find worker/src -type f -name '*.js' -print0)