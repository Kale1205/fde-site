name: One-time integrity validator hardening

on:
  push:
    paths:
      - '.github/workflows/strengthen-integrity-validator-once.yml'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Harden repository invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/validate_repo.py')
          s=p.read_text(encoding='utf-8')
          old='''    "MAINTENANCE_ENGLISH_ONLY.md",\n}'''
          new='''    "MAINTENANCE_ENGLISH_ONLY.md",\n    "products-clean.js",\n    "products-clean.css",\n    "order.js",\n    "commerce-ui.js",\n    "license-spec-patch.js",\n    "license-page-i18n.js",\n    "ims-plan-spec-patch.js",\n    ".github/scripts/apply_brand_editorial.py",\n    ".github/scripts/apply_cms_public.py",\n    ".github/scripts/apply_green_brand.py",\n    ".github/scripts/apply_responsive_news.py",\n}'''
          if old not in s: raise SystemExit('obsolete-file insertion point not found')
          s=s.replace(old,new,1)
          old='''    "index.html": ("class=\\"news-strip\\"", "id=\\"plans\\"", "class=\\"ims-compare\\"", "cms-content.js"),'''
          new='''    "index.html": ("class=\\"news-strip\\"", "id=\\"plans\\"", "class=\\"ims-compare\\"", "cms-content.js", "ims-compare-en.js"),'''
          if old not in s: raise SystemExit('English index marker not found')
          s=s.replace(old,new,1)
          old='''    "ja/contact.html": ("contact-config.js", "contact-direct.js", "faq-cms.js"),\n}'''
          new='''    "ja/contact.html": ("contact-config.js", "contact-direct.js", "faq-cms.js"),\n    "license.html": ("license-page-en.js",),\n}'''
          if old not in s: raise SystemExit('required marker insertion point not found')
          s=s.replace(old,new,1)
          marker='# CMS admin remains Japanese; public CMS data must contain both Japanese and English.\n'
          guard='''# Shared public runtimes must not depend on the retired browser language state.\nfor rel in ("site.js", "faq-cms.js", "contact-direct.js", "cms-content.js", "cms-content-ja.js"):\n    path = ROOT / rel\n    if not path.exists():\n        fail(f"{rel} is missing")\n        continue\n    text = path.read_text(encoding="utf-8")\n    for legacy in ("fde-lang", "querySelector('#lang')", 'querySelector("#lang")', "getElementById('lang')", 'getElementById("lang")'):\n        if legacy in text:\n            fail(f"{rel}: retired browser language-state dependency found: {legacy}")\n\n'''
          if marker not in s: raise SystemExit('CMS marker not found')
          s=s.replace(marker,guard+marker,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit validator hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/validate_repo.py
          git commit -m "Enforce dual-site runtime invariants"
          git push
