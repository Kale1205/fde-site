name: Apply public CMS integration

on:
  push:
    paths:
      - '.github/workflows/apply-cms-public.yml'
      - '.github/scripts/apply_cms_public.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply CMS integration
        run: python .github/scripts/apply_cms_public.py
      - name: Commit changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html why.html goals.html news.html
          git commit -m "Connect public pages to CMS content"
          git push
