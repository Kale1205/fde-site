name: Apply Baked Kale green brand

on:
  push:
    paths:
      - '.github/workflows/apply-green-brand.yml'
      - '.github/scripts/apply_green_brand.py'
      - 'brand-green.css'
      - 'assets/baked-kale-mark.svg'
      - 'assets/baked-kale-logo.svg'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply green brand
        run: python .github/scripts/apply_green_brand.py
      - name: Commit changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html why.html goals.html contact.html news.html demo.html
          git commit -m "Apply Baked Kale green brand across site"
          git push
