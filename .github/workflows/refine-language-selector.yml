name: Refine Asia language selector

on:
  push:
    paths:
      - '.github/workflows/refine-language-selector.yml'

permissions:
  contents: write

jobs:
  update-language-selector:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update language selector and copy
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old_select_start = '<select id="lang" class="lang" aria-label="Language">'
          old_select_end = '</select>'
          start = s.find(old_select_start)
          if start == -1:
              raise SystemExit('Language selector not found')
          end = s.find(old_select_end, start)
          if end == -1:
              raise SystemExit('Language selector closing tag not found')
          end += len(old_select_end)

          new_select = '''<select id="lang" class="lang" aria-label="Language / 言語" title="Language / 言語">
<option value="ja">日本語</option>
<option value="en">English</option>
<option value="zh-CN">简体中文</option>
<option value="zh-TW">繁體中文</option>
<option value="ko">한국어</option>
<option value="id">Bahasa Indonesia</option>
<option value="ms">Bahasa Melayu</option>
<option value="vi">Tiếng Việt</option>
<option value="th">ไทย</option>
<option value="hi">हिन्दी</option>
<option value="ar">العربية</option>
</select>'''
          s = s[:start] + new_select + s[end:]

          # Clarify rollout copy in both JA and EN translation dictionaries.
          s = s.replace(
              "asiaLead:'日本語・英語を基軸に、東南アジア、南アジア、西アジア、中央アジアへ段階的に展開します。言語プルダウンから主要言語へ切替できます。'",
              "asiaLead:'日本語・英語を基軸に、中国語・韓国語・インドネシア語・マレー語・ベトナム語・タイ語・ヒンディー語・アラビア語など、主要市場の言語へ段階的に対応します。'"
          )
          s = s.replace(
              "asiaLead:'Japanese and English are the base, with staged expansion into Southeast, South, West and Central Asia. Major languages are available from the selector.'",
              "asiaLead:'Japanese and English are the base, with priority support for major Asian markets including Chinese, Korean, Indonesian, Malay, Vietnamese, Thai, Hindi and Arabic.'"
          )

          # Keep native JA/EN switching and use the site default Japanese source for other selected languages.
          old_handler = "else{location.href='https://translate.google.com/translate?sl=auto&tl='+encodeURIComponent(n)+'&u='+encodeURIComponent(location.href.split('#')[0])}"
          new_handler = "else{localStorage.setItem('fde-lang',n);location.href='https://translate.google.com/translate?sl=ja&tl='+encodeURIComponent(n)+'&u='+encodeURIComponent(location.href.split('#')[0])}"
          if old_handler in s:
              s = s.replace(old_handler, new_handler)

          # Reset unsupported saved languages from the old, larger selector.
          old_init = "let L=localStorage.getItem('fde-lang')||'ja';if(!['ja','en'].includes(L))L='ja';"
          new_init = "const supportedLangs=['ja','en','zh-CN','zh-TW','ko','id','ms','vi','th','hi','ar'];let L=localStorage.getItem('fde-lang')||'ja';if(!supportedLangs.includes(L))L='ja';if(!['ja','en'].includes(L))L='ja';"
          if old_init in s:
              s = s.replace(old_init, new_init)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Refine Asia language selector"
          git push
