name: P3 Sentinel activation debug

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  actions: read

jobs:
  debug:
    if: github.event.pull_request.number == 48
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_SENTINEL_TOKEN: ${{ secrets.CLOUDFLARE_SENTINEL_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run redacted Sentinel diagnostics
        run: python scripts/p3_sentinel_activation_debug.py
