name: One-time dynamic asset validator hardening

on:
  push:
    paths:
      - '.github/workflows/harden-dynamic-asset-check-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Harden contact-config dynamic asset validation
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/validate_repo.py')
          s=p.read_text(encoding='utf-8')
          old='''    for match in re.finditer(r"(?P<path>/fde-site/[A-Za-z0-9_./-]+\\.(?:js|css))\\?v=(?P<v>[0-9A-Za-z._-]+)", text):\n        rel = match.group("path")[len("/fde-site/"):]\n        if not (ROOT / rel).exists():\n            fail(f"contact-config.js: dynamic local asset does not exist: {match.group('path')}")\n        if version and match.group("v") != version:\n            fail(f"contact-config.js: dynamic asset build key {match.group('v')!r} != {version!r}: {match.group('path')}")\n'''
          new='''    for match in re.finditer(r"[\\\"'](?P<path>(?!https?://|//)[A-Za-z0-9_./-]+\\.(?:js|css))\\?v=(?P<v>[0-9A-Za-z._-]+)[\\\"']", text):\n        rel = match.group("path")\n        if rel.startswith("/fde-site/"):\n            rel = rel[len("/fde-site/"):]\n        elif rel.startswith("/"):\n            continue\n        if not (ROOT / rel).exists():\n            fail(f"contact-config.js: dynamic local asset does not exist: {match.group('path')}")\n        if version and match.group("v") != version:\n            fail(f"contact-config.js: dynamic asset build key {match.group('v')!r} != {version!r}: {match.group('path')}")\n'''
          if old not in s:
              raise SystemExit('dynamic asset validation block not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Commit validator update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/validate_repo.py
          git commit -m "Validate all dynamic local asset versions"
          git push
