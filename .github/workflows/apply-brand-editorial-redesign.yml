name: Apply brand editorial redesign

on:
  push:
    paths:
      - '.github/workflows/apply-brand-editorial-redesign.yml'
      - '.github/scripts/apply_brand_editorial.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch script
        run: python .github/scripts/apply_brand_editorial.py
      - name: Commit changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html why.html goals.html news.html contact.html demo.html sitemap.xml
          git commit -m "Apply editorial redesign and Baked Kale business profile"
          git push
