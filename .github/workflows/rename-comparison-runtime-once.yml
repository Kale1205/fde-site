name: One-time English comparison runtime rename

on:
  push:
    paths:
      - '.github/workflows/rename-comparison-runtime-once.yml'

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace old runtime reference
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='ims-plan-spec-patch.js'
          new='ims-compare-en.js'
          if s.count(old)!=1:
              raise SystemExit(f'Expected exactly one {old} reference, found {s.count(old)}')
          p.write_text(s.replace(old,new),encoding='utf-8')
          PY
      - name: Commit rename
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Use English comparison runtime"
          git push
