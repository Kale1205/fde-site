name = "kales-fde-contact"
main = "src/index-v6.js"
compatibility_date = "2026-08-16"
workers_dev = true

[vars]
ALLOWED_ORIGIN = "https://kale1205.github.io"
ADMIN_EMAIL = "reyouinjune@gmail.com"
FROM_NAME = "Kale’s FDE"
# FROM_EMAIL should be set to a sender address verified in Brevo.
# BREVO_API_KEY must be stored as a Worker secret, never committed here.
# ADMIN_FULFILLMENT_KEY must be stored as a Worker secret for admin-only status/delivery/customer/PDF/CMS translation actions.

[ai]
binding = "AI"

[browser]
binding = "BROWSER"

[[kv_namespaces]]
binding = "ORDER_STATUS"
