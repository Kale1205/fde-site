<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" role="img" aria-labelledby="t d"><title id="t">Kale's FDE business model</title><desc id="d">Small businesses and sole proprietors feed recurring workflow problems into Kale's FDE, which standardizes them into practical software products.</desc><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#073d2b"/><stop offset="1" stop-color="#188755"/></linearGradient><filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="15" stdDeviation="22" flood-color="#0b3f2d" flood-opacity=".11"/></filter></defs><rect width="1600" height="760" fill="#fff"/><g font-family="Arial,sans-serif"><text x="800" y="62" text-anchor="middle" font-size="50" font-weight="800" fill="#17251f"><tspan fill="#0e7a4b">Kale’s</tspan> FDE Business Model</text><text x="800" y="103" text-anchor="middle" font-size="17" font-weight="700" letter-spacing="5" fill="#5c7065">FROM WORKFLOW PROBLEMS TO PRACTICAL SOFTWARE</text><g transform="translate(70 150)"><circle cx="72" cy="40" r="46" fill="#f4f8f5" stroke="#b9cabf"/><path d="M44 35h56v35H44zM36 35l12-18h48l12 18M58 70v-20h28v20" fill="none" stroke="#0e7a4b" stroke-width="5"/><text x="140" y="24" fill="#0e7a4b" font-size="16" font-weight="800" letter-spacing="2">WHO RECEIVES VALUE</text><text x="140" y="62" fill="#17251f" font-size="34" font-weight="800">Small Businesses &amp;</text><text x="140" y="100" fill="#17251f" font-size="34" font-weight="800">Sole Proprietors</text><g transform="translate(20 145)"><g fill="#f4f8f5" stroke="#cbd8d0"><circle cx="42" cy="35" r="31"/><circle cx="42" cy="118" r="31"/><circle cx="42" cy="201" r="31"/><circle cx="42" cy="284" r="31"/></g><g stroke="#0e7a4b" stroke-width="4" fill="none"><circle cx="42" cy="35" r="13"/><path d="M42 15v10M42 45l12 9M27 118h30M32 108v20M42 103v30M52 111v22M27 201h30v22H27zM31 195h22M24 294l16-17 12 8 13-20M24 294h38"/></g><g fill="#17251f" font-size="18" font-weight="800"><text x="90" y="31">Manual work</text><text x="90" y="114">Errors &amp; rework</text><text x="90" y="197">Scattered tools</text><text x="90" y="280">Limits growth</text></g><g fill="#6b7c73" font-size="14"><text x="90" y="53">Time lost to repetitive processes</text><text x="90" y="136">Inconsistent data and handoffs</text><text x="90" y="219">Files and data spread across places</text><text x="90" y="302">Busy work gets in the way</text></g></g></g><circle cx="525" cy="390" r="42" fill="url(#g)"/><path d="M505 390h37M530 374l16 16-16 16" fill="none" stroke="#fff" stroke-width="6"/><g transform="translate(570 145)"><circle cx="75" cy="45" r="52" fill="#f4f8f5" stroke="#b9cabf"/><path d="M62 82c-12-53 7-84 27-103 6 23 8 38 4 54 15-10 28-20 40-36-2 43-21 74-56 93" fill="none" stroke="#0e7a4b" stroke-width="6" stroke-linecap="round"/><text x="150" y="27" fill="#0e7a4b" font-size="16" font-weight="800" letter-spacing="2">WHAT KALE’S FDE DOES</text><text x="150" y="66" fill="#17251f" font-size="34" font-weight="800">Organize &amp; Productize</text><text x="150" y="96" fill="#62766b" font-size="16">Turn recurring workflows into standardized software.</text><g transform="translate(0 145)" filter="url(#s)"><rect x="0" y="0" width="500" height="235" rx="28" fill="#fff" stroke="#d2ddd6"/><g transform="translate(40 38)"><g fill="#f4f8f5" stroke="#c8d7cf"><circle cx="45" cy="45" r="36"/><circle cx="165" cy="45" r="36"/><circle cx="285" cy="45" r="36"/><circle cx="405" cy="45" r="36"/></g><g stroke="#0e7a4b" stroke-width="4" fill="none"><circle cx="45" cy="45" r="15"/><path d="M57 57l13 13M145 45h40M165 25v40M269 33l-14 12 14 12M301 33l14 12-14 12M390 45l11 11 20-24"/></g><g fill="#0e7a4b" font-size="13" font-weight="800" text-anchor="middle"><text x="45" y="112">DISCOVER</text><text x="165" y="112">STANDARDIZE</text><text x="285" y="112">PRODUCTIZE</text><text x="405" y="112">VALIDATE</text></g><path d="M83 45h44M203 45h44M323 45h44" stroke="#9db5a7" stroke-width="3"/><path d="M116 35l11 