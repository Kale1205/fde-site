xt x="124" y="277" font-size="13" fill="#0e7a4b">Workflow Digitalization</text><text x="124" y="301" font-size="12" fill="#687b70">Streamline. Automate. Scale.</text></g></g><g transform="translate(165 650)"><rect x="0" y="0" width="1270" height="78" rx="24" fill="#f8fbf9" stroke="#d6e1da"/><g fill="#0e7a4b" font-size="16" font-weight="800"><text x="160" y="34">STANDARDIZE</text><text x="570" y="34">DEPLOY</text><text x="990" y="34">SUSTAIN</text></g><g fill="#61746a" font-size="13"><text x="160" y="56">Create order from recurring complexity.</text><text x="570" y="56">Deliver software teams can adopt.</text><text x="990" y="56">Evolve for long-term value.</text></g><g stroke="#0e7a4b" stroke-width="4" fill="none"><circle cx="100" cy="39" r="24"/><circle cx="510" cy="39" r="24"/><circle cx="930" cy="39" r="24"/><path d="M89 39l8 8 16-18M498 39h24M510 27v24M918 45c10-18 22-18 24-28 6 20-4 31-17 34"/></g><path d="M390 39h75M455 29l12 10-12 10M800 39h75M865 29l12 10-12 10" fill="none" stroke="#8fb19e" stroke-width="3"/></g></g></svg>